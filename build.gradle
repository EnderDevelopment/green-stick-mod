plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

ext.loom {
    minecraftVersion = '1.21.4'
    mappings = '1.21.4+build.1'
    run {
        version = 'release'
        property 'fabric-api', 'true'
        property 'fabric-api-deprecated', 'true'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:1.21.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.96.7+1.21.4'
}

processResources {
    inputs.property 'fabric.mod.json', project.file('src/main/resources/fabric.mod.json')
}
